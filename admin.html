<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APLLS 2026 - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .receipt-image {
            max-width: 200px;
            max-height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            max-height: 80%;
            object-fit: contain;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">APLLS 2026 - Admin Dashboard</h1>
                <div class="flex space-x-4">
                    <input type="password" id="adminPassword" placeholder="Admin Password" class="px-3 py-2 border rounded">
                    <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Login</button>
                    <button onclick="refreshData()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Refresh</button>
                </div>
            </div>

            <div id="loginMessage" class="mb-4 p-3 rounded hidden"></div>
            
            <div id="adminContent" class="hidden">
                <div class="mb-6">
                    <h2 class="text-xl font-semibold mb-4">Registration Statistics</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-blue-100 p-4 rounded">
                            <h3 class="font-semibold">Total Registrations</h3>
                            <p id="totalRegistrations" class="text-2xl font-bold text-blue-600">-</p>
                        </div>
                        <div class="bg-green-100 p-4 rounded">
                            <h3 class="font-semibold">With Payment Receipts</h3>
                            <p id="withReceipts" class="text-2xl font-bold text-green-600">-</p>
                        </div>
                        <div class="bg-yellow-100 p-4 rounded">
                            <h3 class="font-semibold">Pending Payment</h3>
                            <p id="pendingPayment" class="text-2xl font-bold text-yellow-600">-</p>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <input type="text" id="searchInput" placeholder="Search by name, email, or registration ID..." 
                           class="w-full px-3 py-2 border rounded" onkeyup="filterRegistrations()">
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border border-gray-300">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 border text-left">Registration ID</th>
                                <th class="px-4 py-2 border text-left">Name</th>
                                <th class="px-4 py-2 border text-left">Email</th>
                                <th class="px-4 py-2 border text-left">Country</th>
                                <th class="px-4 py-2 border text-left">Registration Date</th>
                                <th class="px-4 py-2 border text-left">Payment Receipt</th>
                            </tr>
                        </thead>
                        <tbody id="registrationsTable">
                            <tr>
                                <td colspan="6" class="px-4 py-8 text-center text-gray-500">Please login to view registrations</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for viewing receipt images -->
    <div id="receiptModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        let registrationsData = [];
        let isLoggedIn = false;

        async function login() {
            const password = document.getElementById('adminPassword').value;
            const messageDiv = document.getElementById('loginMessage');
            
            try {
                const response = await fetch('/.netlify/functions/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    isLoggedIn = true;
                    document.getElementById('adminContent').classList.remove('hidden');
                    messageDiv.className = 'mb-4 p-3 rounded bg-green-100 text-green-700';
                    messageDiv.textContent = 'Login successful!';
                    messageDiv.classList.remove('hidden');
                    await loadRegistrations();
                } else {
                    messageDiv.className = 'mb-4 p-3 rounded bg-red-100 text-red-700';
                    messageDiv.textContent = 'Invalid password';
                    messageDiv.classList.remove('hidden');
                }
            } catch (error) {
                messageDiv.className = 'mb-4 p-3 rounded bg-red-100 text-red-700';
                messageDiv.textContent = 'Login failed: ' + error.message;
                messageDiv.classList.remove('hidden');
            }
        }

        async function loadRegistrations() {
            if (!isLoggedIn) return;
            
            try {
                const response = await fetch('/.netlify/functions/admin-registrations-neon');
                const result = await response.json();
                
                if (result.success) {
                    registrationsData = result.registrations || result.data;
                    updateStatistics();
                    displayRegistrations(registrationsData);
                } else {
                    console.error('Failed to load registrations:', result.error);
                }
            } catch (error) {
                console.error('Error loading registrations:', error);
            }
        }

        function updateStatistics() {
            const total = registrationsData.length;
            const withReceipts = registrationsData.filter(reg => reg.payment_slip_url).length;
            const pending = total - withReceipts;
            
            document.getElementById('totalRegistrations').textContent = total;
            document.getElementById('withReceipts').textContent = withReceipts;
            document.getElementById('pendingPayment').textContent = pending;
        }

        function displayRegistrations(data) {
            const tbody = document.getElementById('registrationsTable');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No registrations found</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(reg => {
                const receiptCell = reg.payment_slip_url ? 
                    `<img src="${reg.payment_slip_url}" alt="Payment Receipt" class="receipt-image" onclick="showModal('${reg.payment_slip_url}')" title="Click to view full size">` :
                    '<span class="text-red-500">No receipt</span>';
                
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border">${reg.registration_id}</td>
                        <td class="px-4 py-2 border">${reg.first_name} ${reg.last_name}</td>
                        <td class="px-4 py-2 border">${reg.email}</td>
                        <td class="px-4 py-2 border">${reg.residence_country || 'N/A'}</td>
                        <td class="px-4 py-2 border">${new Date(reg.created_at).toLocaleDateString()}</td>
                        <td class="px-4 py-2 border">${receiptCell}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterRegistrations() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = registrationsData.filter(reg => {
                return reg.registration_id.toLowerCase().includes(searchTerm) ||
                       `${reg.first_name} ${reg.last_name}`.toLowerCase().includes(searchTerm) ||
                       reg.email.toLowerCase().includes(searchTerm);
            });
            
            displayRegistrations(filtered);
        }

        function showModal(imageSrc) {
            const modal = document.getElementById('receiptModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById('receiptModal').style.display = 'none';
        }

        async function refreshData() {
            if (isLoggedIn) {
                await loadRegistrations();
            }
        }

        // Close modal when clicking outside the image
        window.onclick = function(event) {
            const modal = document.getElementById('receiptModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Allow Enter key to login
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
